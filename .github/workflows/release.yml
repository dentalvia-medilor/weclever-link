name: Release WeLink

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      gitlab_ref:
        description: GitLab branch to build
        required: true
        default: develop
        type: string
      version:
        description: Optional version (for example 2.0.0); leave empty to increment the current patch version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}-${{ inputs.gitlab_ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      mac_metadata: ${{ steps.validate.outputs.mac_metadata }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      release_version: ${{ steps.version.outputs.release_version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      windows_metadata: ${{ steps.validate.outputs.windows_metadata }}
    steps:
      - name: Validate release inputs
        id: validate
        shell: bash
        env:
          GITLAB_REF: ${{ inputs.gitlab_ref }}
          RELEASE_ENV: ${{ inputs.environment }}
        run: |
          case "$RELEASE_ENV" in
            dev)
              [[ "$GITLAB_REF" == "develop" ]]
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "windows_metadata=dev.yml" >> "$GITHUB_OUTPUT"
              echo "mac_metadata=dev-mac.yml" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              [[ "$GITLAB_REF" == release/*-staging ]]
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "windows_metadata=staging.yml" >> "$GITHUB_OUTPUT"
              echo "mac_metadata=staging-mac.yml" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              [[ "$GITLAB_REF" == "master" ]]
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "windows_metadata=latest.yml" >> "$GITHUB_OUTPUT"
              echo "mac_metadata=latest-mac.yml" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $RELEASE_ENV" >&2
              exit 1
              ;;
          esac

      - name: Resolve the GitLab source commit
        id: source
        shell: bash
        env:
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          GITLAB_REF: ${{ inputs.gitlab_ref }}
        run: |
          if [[ -z "$GITLAB_DEPLOY_USER" || -z "$GITLAB_READ_TOKEN" ]]; then
            echo "GitLab deploy credentials are not configured" >&2
            exit 1
          fi

          git init source
          git -C source remote add origin \
            "https://${GITLAB_DEPLOY_USER}:${GITLAB_READ_TOKEN}@gitlab.com/vdv_/weclever-link.git"
          git -C source fetch --depth 1 origin "$GITLAB_REF"
          git -C source checkout --detach FETCH_HEAD
          git -C source remote set-url origin https://gitlab.com/vdv_/weclever-link.git

          source_sha=$(git -C source rev-parse HEAD)

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve the release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENV: ${{ inputs.environment }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          version_is_greater() {
            local candidate_major candidate_minor candidate_patch
            local reference_major reference_minor reference_patch

            IFS=. read -r candidate_major candidate_minor candidate_patch <<< "$1"
            IFS=. read -r reference_major reference_minor reference_patch <<< "$2"

            ((
              10#$candidate_major > 10#$reference_major ||
              (10#$candidate_major == 10#$reference_major && 10#$candidate_minor > 10#$reference_minor) ||
              (10#$candidate_major == 10#$reference_major && 10#$candidate_minor == 10#$reference_minor && 10#$candidate_patch > 10#$reference_patch)
            ))
          }

          case "$RELEASE_ENV" in
            dev)
              current_version=$(node -p "require('./source/electron-builder.dev.json').extraMetadata.version")
              suffix="-dev"
              ;;
            staging)
              current_version=$(node -p "require('./source/electron-builder.staging.json').extraMetadata.version")
              suffix="-staging"
              ;;
            prod)
              current_version=$(node -p "require('./source/package.json').version")
              suffix=""
              ;;
          esac

          current_base="$current_version"
          if [[ -n "$suffix" && "$current_base" == *"$suffix" ]]; then
            current_base="${current_base%$suffix}"
          fi

          if [[ ! "$current_base" =~ $semver_pattern ]]; then
            echo "Stored version ${current_version} is invalid for ${RELEASE_ENV}." >&2
            exit 1
          fi

          while IFS= read -r tag; do
            published_version="${tag#v}"
            if [[ -n "$suffix" ]]; then
              [[ "$published_version" == *"$suffix" ]] || continue
              published_version="${published_version%$suffix}"
            fi

            [[ "$published_version" =~ $semver_pattern ]] || continue
            if version_is_greater "$published_version" "$current_base"; then
              current_base="$published_version"
            fi
          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName \
              --jq '.[].tagName'
          )

          requested_version="${VERSION_INPUT#v}"
          if [[ -n "$requested_version" ]]; then
            if [[ -n "$suffix" && "$requested_version" == *"$suffix" ]]; then
              requested_version="${requested_version%$suffix}"
            fi

            if [[ ! "$requested_version" =~ $semver_pattern ]]; then
              echo "Version ${VERSION_INPUT} is invalid. Use a semantic version such as 2.0.0." >&2
              exit 1
            fi

            if ! version_is_greater "$requested_version" "$current_base"; then
              echo "Version ${requested_version} must be greater than ${current_base}." >&2
              exit 1
            fi

            release_version="${requested_version}${suffix}"
          else
            IFS=. read -r major minor patch <<< "$current_base"
            release_version="${major}.${minor}.$((10#$patch + 1))${suffix}"
          fi

          echo "Resolved release version: ${release_version}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Ensure the release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

  build-windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Check out the resolved GitLab commit
        shell: bash
        env:
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          git init source
          cd source
          git remote add origin "https://${GITLAB_DEPLOY_USER}:${GITLAB_READ_TOKEN}@gitlab.com/vdv_/weclever-link.git"
          git fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://gitlab.com/vdv_/weclever-link.git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/frontend/package-lock.json

      - name: Install dependencies
        working-directory: source
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Prepare the release version
        working-directory: source
        shell: bash
        env:
          GITLAB_REF: ${{ inputs.gitlab_ref }}
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: npm run prepare:ci:release -- "$RELEASE_ENV" "$RELEASE_VERSION" "$GITLAB_REF"

      - name: Build the Windows installer
        working-directory: source
        shell: bash
        env:
          RELEASE_ENV: ${{ inputs.environment }}
        run: |
          npm run fe-lang
          node scripts/create-env.js "$RELEASE_ENV"
          npx dotenv -e ".env.${RELEASE_ENV}" -- node scripts/gen-env.js
          npm run pre-pare:publish

          config_args=()
          if [[ "$RELEASE_ENV" != "prod" ]]; then
            config_args=(--config "electron-builder.${RELEASE_ENV}.json")
          fi

          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false \
            electron-builder "${config_args[@]}" --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.validate.outputs.release_version }}
          if-no-files-found: error
          retention-days: 3
          path: |
            source/release/*.exe
            source/release/*.exe.blockmap
            source/release/${{ needs.validate.outputs.windows_metadata }}

  build-macos:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out the resolved GitLab commit
        shell: bash
        env:
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          git init source
          cd source
          git remote add origin "https://${GITLAB_DEPLOY_USER}:${GITLAB_READ_TOKEN}@gitlab.com/vdv_/weclever-link.git"
          git fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://gitlab.com/vdv_/weclever-link.git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/frontend/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Prepare Apple credentials
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
        run: |
          if [[ -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_KEY_P8_BASE64" || -z "$MAC_CERTIFICATE_P12_BASE64" ]]; then
            echo "Apple signing secrets are not fully configured" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | openssl base64 -d -A \
            > "$RUNNER_TEMP/apple/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A \
            > "$RUNNER_TEMP/apple/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/apple"/*

      - name: Prepare the release version
        working-directory: source
        env:
          GITLAB_REF: ${{ inputs.gitlab_ref }}
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: npm run prepare:ci:release -- "$RELEASE_ENV" "$RELEASE_VERSION" "$GITLAB_REF"

      - name: Build, sign, and notarize macOS packages
        working-directory: source
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CI: "false"
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ runner.temp }}/apple/developer-id.p12
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          npm run fe-lang
          npm run "prepare:mac:${RELEASE_ENV}"
          node scripts/build-mac.js \
            "--environment=${RELEASE_ENV}" \
            "--version=${RELEASE_VERSION}" \
            arm64 x64

      - name: Verify macOS signatures and notarization tickets
        working-directory: source
        shell: bash
        run: |
          verified=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            verified=$((verified + 1))
          done < <(find release -maxdepth 2 -type d -name '*.app' -print0)

          if [[ "$verified" -ne 2 ]]; then
            echo "Expected two signed app bundles, found ${verified}" >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.validate.outputs.release_version }}
          if-no-files-found: error
          retention-days: 3
          path: |
            source/release/*-${{ needs.validate.outputs.release_version }}-mac-*.dmg
            source/release/*-${{ needs.validate.outputs.release_version }}-mac-*.dmg.blockmap
            source/release/*-${{ needs.validate.outputs.release_version }}-mac-*.zip
            source/release/*-${{ needs.validate.outputs.release_version }}-mac-*.zip.blockmap
            source/release/${{ needs.validate.outputs.mac_metadata }}

  publish:
    needs:
      - validate
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate the complete artifact set
        shell: bash
        env:
          MAC_METADATA: ${{ needs.validate.outputs.mac_metadata }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          WINDOWS_METADATA: ${{ needs.validate.outputs.windows_metadata }}
        run: |
          count_files() {
            find artifacts -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '
          }

          [[ "$(count_files '*.exe')" == "1" ]]
          [[ "$(count_files '*.exe.blockmap')" == "1" ]]
          [[ "$(count_files '*.dmg')" == "2" ]]
          [[ "$(count_files '*.dmg.blockmap')" == "2" ]]
          [[ "$(count_files '*.zip')" == "2" ]]
          [[ "$(count_files '*.zip.blockmap')" == "2" ]]
          [[ -f "artifacts/${WINDOWS_METADATA}" ]]
          [[ -f "artifacts/${MAC_METADATA}" ]]

          while IFS= read -r file; do
            case "$(basename "$file")" in
              "$WINDOWS_METADATA"|"$MAC_METADATA") ;;
              *"$RELEASE_VERSION"*) ;;
              *)
                echo "Artifact does not contain the release version: $file" >&2
                exit 1
                ;;
            esac
          done < <(find artifacts -maxdepth 1 -type f -print)

          find artifacts -maxdepth 1 -type f -print | sort

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_REF: ${{ inputs.gitlab_ref }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          cat > release-notes.md <<EOF
          Automated WeLink ${RELEASE_ENV} release.

          GitLab ref: ${GITLAB_REF}
          GitLab commit: ${SOURCE_SHA}

          The Windows installer is currently unsigned. macOS packages are signed and notarized.
          EOF

          mapfile -d '' files < <(find artifacts -maxdepth 1 -type f -print0)
          args=(
            --repo "$GITHUB_REPOSITORY"
            --target main
            --title "$RELEASE_VERSION"
            --notes-file release-notes.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "v${RELEASE_VERSION}" "${files[@]}" "${args[@]}"

      - name: Synchronize the development version in GitLab
        if: ${{ inputs.environment == 'dev' }}
        shell: bash
        env:
          GITLAB_WRITE_TOKEN: ${{ secrets.GITLAB_WRITE_TOKEN }}
          GITLAB_WRITE_USER: ${{ secrets.GITLAB_WRITE_USER }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          if [[ -z "$GITLAB_WRITE_USER" || -z "$GITLAB_WRITE_TOKEN" ]]; then
            echo "GitLab write credentials are not configured" >&2
            exit 1
          fi

          version_is_greater() {
            local candidate_major candidate_minor candidate_patch
            local reference_major reference_minor reference_patch

            IFS=. read -r candidate_major candidate_minor candidate_patch <<< "$1"
            IFS=. read -r reference_major reference_minor reference_patch <<< "$2"

            ((
              10#$candidate_major > 10#$reference_major ||
              (10#$candidate_major == 10#$reference_major && 10#$candidate_minor > 10#$reference_minor) ||
              (10#$candidate_major == 10#$reference_major && 10#$candidate_minor == 10#$reference_minor && 10#$candidate_patch > 10#$reference_patch)
            ))
          }

          authenticated_url="https://${GITLAB_WRITE_USER}:${GITLAB_WRITE_TOKEN}@gitlab.com/vdv_/weclever-link.git"
          git clone --depth 1 --branch develop "$authenticated_url" gitlab-source
          git -C gitlab-source remote set-url origin https://gitlab.com/vdv_/weclever-link.git

          current_version=$(node -p "require('./gitlab-source/electron-builder.dev.json').extraMetadata.version")
          if [[ "$current_version" == "$RELEASE_VERSION" ]]; then
            echo "GitLab develop already uses ${RELEASE_VERSION}."
            exit 0
          fi

          current_base="${current_version%-dev}"
          release_base="${RELEASE_VERSION%-dev}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ ! "$current_base" =~ $semver_pattern ]]; then
            echo "Stored development version ${current_version} is invalid." >&2
            exit 1
          fi

          if version_is_greater "$current_base" "$release_base"; then
            echo "GitLab develop already contains the newer version ${current_version}; synchronization skipped."
            exit 0
          fi

          node gitlab-source/scripts/prepare-ci-release.js \
            dev "$RELEASE_VERSION" develop

          if git -C gitlab-source diff --quiet -- electron-builder.dev.json; then
            echo "No GitLab version change is required."
            exit 0
          fi

          git -C gitlab-source config user.name "WeLink Release Bot"
          git -C gitlab-source config user.email "weclever-release-bot@users.noreply.github.com"
          git -C gitlab-source add electron-builder.dev.json
          git -C gitlab-source commit \
            -m "chore: sync development version to ${RELEASE_VERSION} [skip ci]"
          git -C gitlab-source push "$authenticated_url" HEAD:develop
